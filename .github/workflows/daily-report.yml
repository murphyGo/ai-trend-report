# One-use branch only. Never merge this workflow into main.
name: Transfer existing AI report Email Secrets
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seal:
    if: >-
      github.repository == 'murphyGo/ai-trend-report' &&
      github.ref == 'refs/heads/codex/ai-report-key-reuse-20261005'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed one-use encryption code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install encryption dependency before any Secret is exposed
        run: python3 -m pip install pynacl==1.6.2
      - name: Encrypt existing email settings to destination Environment
        env:
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
        run: python3 -I scripts/seal_email_secrets.py
      - name: Upload only destination-encrypted values
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ai-report-email-secrets-sealed-${{ github.run_id }}
          path: ${{ runner.temp }}/ai-report-email-secrets.sealed.json
          retention-days: 1
          if-no-files-found: error
      - name: Remove encrypted scratch file
        if: always()
        run: |
          python3 -I - <<'PYCODE'
          import os
          from pathlib import Path
          (Path(os.environ["RUNNER_TEMP"]) / "ai-report-email-secrets.sealed.json").unlink(missing_ok=True)
          PYCODE
